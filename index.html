<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat Famiglia</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chat Famiglia">
</head>
<body>

  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
  </div>

  <div id="device-name-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Come si chiama questo dispositivo?</h2>
      <p class="modal-hint">Il nome apparirà sui messaggi inviati da qui, per riconoscere chi scrive (es. "Nonna Maria").</p>
      <input id="device-name-input" type="text" placeholder="Es. Nonna Maria" maxlength="40" autocomplete="off">
      <button id="device-name-confirm-btn" type="button">Conferma</button>
    </div>
  </div>

  <main id="auth-section" class="card">
    <button id="auth-back-btn" class="secondary hidden" type="button">← Indietro</button>
    <div class="logo-container">
      <img src="icons/icon-192.png" alt="Logo Chat Famiglia">
    </div>
    <h1>Accedi</h1>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="nome@esempio.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-buttons">
      <button id="login-btn" type="button">Accedi</button>
      <button id="signup-btn" type="button" class="secondary">Registrati</button>
    </div>
    <p id="auth-message" class="message"></p>
  </main>

  <main id="room-list-section" class="rooms-app hidden">
    <header class="app-header">
      <h1>Chat Famiglia</h1>
      <div class="header-actions">
        <button id="add-room-btn" class="icon-toggle-btn" type="button" aria-label="Aggiungi account/gruppo">➕</button>
      </div>
    </header>
    <ul id="room-list"></ul>
    <footer class="app-footer">
      <button id="translator-open-btn" class="translator-footer-btn" type="button" aria-label="Apri il traduttore">
        <svg viewBox="0 0 3 2" width="24" height="16" aria-hidden="true"><rect width="1" height="2" x="0" y="0" fill="#0055A4"/><rect width="1" height="2" x="1" y="0" fill="#ffffff"/><rect width="1" height="2" x="2" y="0" fill="#EF4135"/></svg>
        <span>Translate</span>
        <svg viewBox="0 0 30 20" width="24" height="16" aria-hidden="true"><rect width="30" height="20" x="0" y="0" fill="#ffffff"/><rect width="6" height="20" x="12" y="0" fill="#CE1124"/><rect width="30" height="6" x="0" y="7" fill="#CE1124"/></svg>
      </button>
    </footer>
  </main>

  <main id="app-section" class="chat-app hidden">
    <header class="app-header">
      <div class="header-title">
        <button id="room-back-btn" class="icon-toggle-btn" type="button" aria-label="Torna alla lista camere">←</button>
        <h1 id="room-title">Chat Famiglia</h1>
      </div>
      <div class="header-actions">
        <button id="notifications-toggle-btn" class="icon-toggle-btn" type="button" aria-label="Attiva o disattiva le notifiche"></button>
        <button id="translation-toggle-btn" class="icon-toggle-btn" type="button" aria-label="Attiva o disattiva la traduzione automatica"></button>
        <button id="logout-btn" class="secondary">Rimuovi</button>
      </div>
    </header>

    <ul id="message-list"></ul>

    <p id="chat-message" class="message"></p>

    <div id="photo-preview" class="photo-preview hidden">
      <img id="photo-preview-img" alt="Anteprima foto">
      <button id="photo-preview-remove" type="button">Rimuovi</button>
    </div>

    <form id="chat-form">
      <label for="photo-camera-input" class="attach-btn" aria-label="Scatta una foto">📷</label>
      <input id="photo-camera-input" type="file" accept="image/*" capture="environment" hidden>
      <label for="photo-input" class="attach-btn" aria-label="Allega una foto dalla galleria">🖼️</label>
      <input id="photo-input" type="file" accept="image/*" hidden>
      <input id="message-input" type="text" placeholder="Scrivi un messaggio..." maxlength="1000" autocomplete="off">
      <button type="submit" class="send-btn" aria-label="Invia messaggio">➤</button>
    </form>
  </main>

  <main id="translator-section" class="translator-app hidden">
    <header class="app-header">
      <div class="header-title">
        <button id="translator-back-btn" class="icon-toggle-btn" type="button" aria-label="Torna alla lista camere">←</button>
        <h1>Traduttore</h1>
      </div>
    </header>

    <div class="translator-body">
      <div class="translator-langs" role="group" aria-label="Lingua di destinazione">
        <button id="translator-lang-fr" type="button" data-translator-lang="fr" aria-pressed="true">
          <svg viewBox="0 0 3 2" width="26" height="18" aria-hidden="true"><rect width="1" height="2" x="0" y="0" fill="#0055A4"/><rect width="1" height="2" x="1" y="0" fill="#ffffff"/><rect width="1" height="2" x="2" y="0" fill="#EF4135"/></svg>
          Francese
        </button>
        <button id="translator-lang-en" type="button" class="secondary" data-translator-lang="en" aria-pressed="false">
          <svg viewBox="0 0 30 20" width="26" height="18" aria-hidden="true"><rect width="30" height="20" x="0" y="0" fill="#ffffff"/><rect width="6" height="20" x="12" y="0" fill="#CE1124"/><rect width="30" height="6" x="0" y="7" fill="#CE1124"/></svg>
          Inglese
        </button>
      </div>

      <div class="field">
        <label for="translator-input">Il tuo testo:</label>
        <input id="translator-input" type="text" placeholder="Scrivi qui…" maxlength="1000" autocomplete="off">
      </div>

      <p id="translator-message" class="message"></p>

      <div class="field">
        <span class="translator-output-label">Traduzione</span>
        <p id="translator-output" class="translator-output" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.113.0/dist/umd/supabase.min.js"
    integrity="sha384-nH2beB85991GFOe5+WLnL1JpeSyR8ncwd7HZXPJppzmxyfWS9WgftZQQAeQjyIai"
    crossorigin="anonymous"></script>
  <script src="lib/pure.js"></script>
  <script src="lib/translator.js"></script>
  <script src="app.js"></script>
  <script src="translator.js"></script>
</body>
</html>
